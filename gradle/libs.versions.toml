[versions]
agp                     = "8.5.2"
kotlin                  = "2.0.21"
coreKtx                 = "1.13.1"
lifecycleRuntime        = "2.8.6"
activityCompose         = "1.9.3"
composeBom              = "2024.10.01"
appcompat               = "1.7.0"
material                = "1.12.0"
preferenceKtx           = "1.2.1"
coroutines              = "1.8.1"
datastore               = "1.1.1"
workmanager             = "2.9.1"
# ML Kit — bundled variant for full offline / F-Droid compliance
mlkit-text-recognition  = "16.0.1"
# Test
junit                   = "4.13.2"
mockk                   = "1.13.12"

[libraries]
# AndroidX core
androidx-core-ktx                 = { group = "androidx.core",           name = "core-ktx",                  version.ref = "coreKtx"          }
androidx-lifecycle-runtime-ktx    = { group = "androidx.lifecycle",      name = "lifecycle-runtime-ktx",     version.ref = "lifecycleRuntime"  }
androidx-activity-compose         = { group = "androidx.activity",       name = "activity-compose",          version.ref = "activityCompose"   }
androidx-appcompat                = { group = "androidx.appcompat",      name = "appcompat",                 version.ref = "appcompat"         }
androidx-preference-ktx           = { group = "androidx.preference",     name = "preference-ktx",            version.ref = "preferenceKtx"     }

# Material Design
material                          = { group = "com.google.android.material", name = "material",              version.ref = "material"          }

# Compose BOM + selected artifacts
androidx-compose-bom              = { group = "androidx.compose",        name = "compose-bom",               version.ref = "composeBom"        }
androidx-ui                       = { group = "androidx.compose.ui",     name = "ui"                                                           }
androidx-ui-graphics              = { group = "androidx.compose.ui",     name = "ui-graphics"                                                  }
androidx-ui-tooling-preview       = { group = "androidx.compose.ui",     name = "ui-tooling-preview"                                           }
androidx-material3                = { group = "androidx.compose.material3", name = "material3"                                                 }
androidx-ui-tooling               = { group = "androidx.compose.ui",     name = "ui-tooling"                                                   }

# Coroutines
kotlinx-coroutines-android        = { group = "org.jetbrains.kotlinx",   name = "kotlinx-coroutines-android", version.ref = "coroutines"       }
kotlinx-coroutines-core           = { group = "org.jetbrains.kotlinx",   name = "kotlinx-coroutines-core",    version.ref = "coroutines"       }

# DataStore (replaces SharedPreferences)
datastore-preferences             = { group = "androidx.datastore",      name = "datastore-preferences",     version.ref = "datastore"         }

# WorkManager
workmanager-ktx                   = { group = "androidx.work",           name = "work-runtime-ktx",          version.ref = "workmanager"       }

# ML Kit — BUNDLED (offline, no Play Services dependency)
mlkit-text-recognition            = { group = "com.google.mlkit",        name = "text-recognition",          version.ref = "mlkit-text-recognition" }

# Test libraries
junit                             = { group = "junit",               name = "junit",                     version.ref = "junit"   }
mockk                             = { group = "io.mockk",            name = "mockk",                     version.ref = "mockk"   }

[plugins]
android-application   = { id = "com.android.application",      version.ref = "agp"    }
kotlin-android        = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose        = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
